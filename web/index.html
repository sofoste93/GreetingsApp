<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061426"><title>GreetingsApp · Event Horizon</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="mobile.css"></head><body>
<main><section class="gate-wrap" aria-label="Animated event horizon"><div class="gate"><div class="horizon"><i></i><i></i><i></i><i></i><i></i></div></div><p class="telemetry">● <span data-i18n="signal">SIGNAL STABLE</span> · SG-2.0</p></section>
<section class="console"><p class="kicker">CHEYENNE MOUNTAIN / DEEP SPACE LINK</p><h1 data-i18n="title">FIRST CONTACT</h1><p class="lede" data-i18n="lede">A tiny Java transmission across the stars.</p><label for="name" data-i18n="callsign">CALL SIGN</label><input id="name" maxlength="48" autocomplete="name" autofocus><button id="send" data-i18n="send">OPEN VORTEX</button><output id="result" aria-live="polite" data-i18n="ready">Ready for first contact.</output><nav><button class="ghost" id="settings">⚙ <span data-i18n="settings">SETTINGS</span></button><button class="ghost" id="help">? <span data-i18n="help">HELP</span></button></nav></section></main>

<dialog id="helpDialog"><button class="close" aria-label="Close">×</button><h2 data-i18n="helpTitle">Mission help</h2><p data-i18n="helpText">Enter a call sign, then press Enter or Open Vortex. The language stays on this device and the app works offline.</p></dialog><script src="app.js"></script></body></html>
